<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Результаты теста</title>
  <link rel="icon" type="image/png" href="pictures/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body {
      background: linear-gradient(to bottom, #d6ecff 0%, #ffffff 100%) no-repeat;
      background-size: 100% 420px;
    }
    .result-hero {
      margin-bottom: 32px;
    }
    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 28px;
      align-items: center;
      margin-bottom: 36px;
    }
    @media (max-width: 760px) {
      .result-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">
    <div class="logo-icon">🌿</div>
    Тест по подбору БАД
  </a>
  <nav class="header-nav">
    <a href="index.html">← На главную</a>
    <a href="test.html">Пройти тест снова</a>
  </nav>
</header>

<main class="main-content" style="max-width:1200px;">

  <div class="result-hero">
    <h1 class="page-title" style="text-align:center;margin-bottom:20px;">Вы успешно прошли тест!</h1>

    <p id="result-desc" style="text-align:center;max-width:100%;margin:0 auto;color:var(--text);line-height:1.7;font-size:0.97rem;">
      На основе ваших ответов мы подобрали оптимальную программу БАД.
    </p>
  </div>

  <h2 style="text-align:center;font-size:1.4rem;font-weight:700;margin-bottom:28px;color:#323232;">Рекомендуем вам</h2>

  <div class="result-grid">

    <div id="benefits-grid" style="display:flex;flex-direction:column;gap:12px;">
      
    </div>

    <div style="border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;">
      <img src="pictures/products-banner.png" alt="Продукты WELLLAB" style="width:100%;display:block;object-fit:cover;">
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <div id="products-grid" style="display:flex;flex-direction:column;gap:10px;">
        
      </div>
      <a href="#" class="btn-download" id="btn-pdf" download style="margin-top:4px;">
        📄 Скачать инструкцию
      </a>
    </div>

  </div>

  <div style="text-align:center;margin-bottom:32px;">
    <button class="btn-accent" id="btn-order" onclick="placeOrder()" style="font-size:1.1rem;padding:16px 48px;border-radius:50px;">
      Оформить заказ: 0 ₽ 🛒
    </button>
  </div>

</main>

<footer class="site-footer">
  © 2026 Наталья Втюрина. ВКРБ. Автоматизация процесса подбора товаров в интернет-магазине
</footer>

<script src="programs-data.js"></script>
<script src="result.js"></script>

</body>
</html>
