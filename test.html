<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Онлайн тест</title>
  <link rel="icon" type="image/png" href="pictures/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .test-layout {
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }
    .test-right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    @media (max-width: 760px) {
      .test-layout {
        flex-direction: column;
      }
      #question-image-wrap {
        width: 100% !important;
      }
      #question-image {
        width: 100% !important;
        height: 220px !important;
      }
    }
  </style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">
    <div class="logo-icon">🌿</div>
    Тест по подбору БАД
  </a>
  <nav class="header-nav">
    <a href="index.html">← Вернуться на главную</a>
  </nav>
</header>

<main class="main-content" style="max-width:1000px;">

  <h1 class="page-title" style="margin-bottom:24px;">Онлайн тест</h1>

  <div class="test-layout">

    <div id="question-image-wrap" style="display:none;flex-shrink:0;width:340px;">
      <img id="question-image" src="" alt="" style="width:340px;height:340px;object-fit:cover;border-radius:var(--radius);display:block;">
    </div>

    <div class="test-right">

      <div style="margin-bottom:20px;">
        <div style="font-weight:700;font-size:1.1rem;color:var(--text);margin-bottom:10px;" id="step-label">Шаг 1/2</div>
        <div class="stepper-bar" style="margin-bottom:10px;">
          <div class="step-track active" id="track-1"></div>
          <div class="step-track" id="track-2"></div>
        </div>
        <span style="font-size:0.88rem;color:var(--text-muted);" id="question-counter">Вопрос 1 / 10</span>
      </div>

      <div class="question-card" id="question-card" style="margin-bottom:20px;">
        <div class="question-text" id="q-text">Загрузка...</div>
        <div id="q-answer-area"></div>
      </div>

  
      <div class="nav-buttons">
        <div class="nav-left">
          <button class="btn-secondary" id="btn-back" disabled>Назад</button>
        </div>
        <button class="btn-primary" id="btn-next" disabled>Далее</button>
      </div>

    </div>
  </div>

</main>

<footer class="site-footer">
  © 2026 Наталья Втюрина. ВКРБ. Автоматизация процесса подбора товаров в интернет-магазине
</footer>

<script src="test.js"></script>

</body>
</html>
